[workspace]
members = ["core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MPL-2.0"
repository = "https://github.com/urdr-db/vs-code-extension"
publish = false

# The Urðr crates, pinned to one release of the database repository
# (decision: git dependency pinned to a tag). Until the next tag ships the
# changes the extension needs, a commit on main. Move every line together.
[workspace.dependencies]
urdr-validate-wasm = { git = "https://github.com/silencesys/dh--urdr", rev = "f6c67f5d261039fce83251cfb1d2495b20da7afa" }
urdr-xdm = { git = "https://github.com/silencesys/dh--urdr", rev = "f6c67f5d261039fce83251cfb1d2495b20da7afa" }
urdr-xml-parse = { git = "https://github.com/silencesys/dh--urdr", rev = "f6c67f5d261039fce83251cfb1d2495b20da7afa" }
urdr-xml-serialize = { git = "https://github.com/silencesys/dh--urdr", rev = "f6c67f5d261039fce83251cfb1d2495b20da7afa" }
urdr-xml-validate = { git = "https://github.com/silencesys/dh--urdr", rev = "f6c67f5d261039fce83251cfb1d2495b20da7afa" }
urdr-xq-analyze = { git = "https://github.com/silencesys/dh--urdr", rev = "f6c67f5d261039fce83251cfb1d2495b20da7afa" }
urdr-xq-exec = { git = "https://github.com/silencesys/dh--urdr", rev = "f6c67f5d261039fce83251cfb1d2495b20da7afa" }
urdr-xq-functions = { git = "https://github.com/silencesys/dh--urdr", rev = "f6c67f5d261039fce83251cfb1d2495b20da7afa" }
urdr-xq-syntax = { git = "https://github.com/silencesys/dh--urdr", rev = "f6c67f5d261039fce83251cfb1d2495b20da7afa" }
urdr-xslt = { git = "https://github.com/silencesys/dh--urdr", rev = "f6c67f5d261039fce83251cfb1d2495b20da7afa" }
serde_json = "1"
# Must match the version urdr-validate-wasm pins, and the wasm-bindgen-cli
# the build uses.
wasm-bindgen = "=0.2.130"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "deny"

[profile.release]
# Small rather than fast to load: the module ships inside the extension.
opt-level = "s"
lto = true
codegen-units = 1
