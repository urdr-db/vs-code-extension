name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A version tag, such as v0.3.0, publishes a release (job "release").
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # The Urðr crates come from a private repository, read with a deploy key
  # (secret URDR_DEPLOY_KEY): git, not cargo's own client, does the fetch.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.URDR_DEPLOY_KEY }}
      - name: Read dh--urdr over SSH
        run: git config --global url."ssh://git@github.com/silencesys/dh--urdr".insteadOf "https://github.com/silencesys/dh--urdr"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Install
        working-directory: extension
        run: npm ci
      - name: Build (WebAssembly, type check, bundle)
        working-directory: extension
        run: npm run build
      - name: Extension tests
        working-directory: extension
        run: npm test
      - name: Package
        working-directory: extension
        run: npx vsce package --no-dependencies -o urdr-xml.vsix
      - name: Examples
        run: zip -qr extension/urdr-xml-examples.zip examples -x 'examples/out/*'
      - uses: actions/upload-artifact@v4
        with:
          name: urdr-xml-vsix
          path: |
            extension/urdr-xml.vsix
            extension/urdr-xml-examples.zip

  # Publishes the build on the repository's Releases page: a version tag
  # (v0.3.0) makes a release of that version; every push to main
  # replaces the "dev" pre-release with the newest build.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: urdr-xml-vsix
      - name: Release a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./extension/package.json").version')"
          if [ "$version" != "$declared" ]; then
            echo "::error::The tag says $version but extension/package.json says $declared"
            exit 1
          fi
          mv urdr-xml.vsix "urdr-xml-$version.vsix"
          flags=""
          case "$version" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "urdr-xml-$version.vsix" urdr-xml-examples.zip \
            --title "Urðr-XML $version" --generate-notes $flags
      - name: Replace the dev pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          version="$(node -p 'require("./extension/package.json").version')"
          short="${GITHUB_SHA::7}"
          mv urdr-xml.vsix "urdr-xml-$version-dev.$short.vsix"
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "urdr-xml-$version-dev.$short.vsix" urdr-xml-examples.zip \
            --target "$GITHUB_SHA" --prerelease --title "Development build ($short)" \
            --notes "The newest build of main ($GITHUB_SHA). Install the .vsix with Extensions → … → Install from VSIX. Not a release: it changes with every merge."
